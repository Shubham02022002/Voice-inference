<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceForge</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main>
    <header>
      <h1>VoiceForge</h1>
      <p>Generate a WAV with Kokoro text-to-speech.</p>
    </header>
    <form>
      <label for="text">Text</label>
      <textarea id="text" rows="6" maxlength="2000" required>Hello, welcome to VoiceForge.</textarea>
      <div class="controls">
        <div>
          <label for="voice">Voice</label>
          <select id="voice">
            <option value="af_heart">Heart</option>
            <option value="af_bella">Bella</option>
            <option value="am_michael">Michael</option>
          </select>
        </div>
        <button type="submit">Generate audio</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" aria-label="Generated audio" hidden>
      <audio controls preload="metadata" aria-label="Generated speech"></audio>
      <a download="voiceforge.wav">Download WAV</a>
    </section>
  </main>
</body>
</html>
