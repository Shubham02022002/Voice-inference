<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceForge Studio</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
  <script src="/benchmarks.js" type="module"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="VoiceForge home"><span class="brand-mark" aria-hidden="true">▂▅▃▇▂</span> VoiceForge</a>
    <nav aria-label="Workspace">
      <a href="#studio"><span aria-hidden="true">◈</span> Speech studio</a>
      <a href="#benchmarks"><span aria-hidden="true">▥</span> Benchmarks</a>
    </nav>
  </aside>
  <main>
    <section id="studio" aria-labelledby="studio-title">
      <header class="section-heading">
        <h1 id="studio-title">Speech studio</h1>
        <p>Generate, listen to, and download speech from Kokoro.</p>
      </header>
      <form class="panel studio">
        <div class="editor">
          <label for="text">Text to synthesize</label>
          <textarea id="text" rows="6" maxlength="2000" required>Hello, welcome to VoiceForge.</textarea>
          <span class="counter" id="character-count"></span>
        </div>
        <div class="settings">
          <label for="voice">Voice</label>
          <select id="voice">
            <option value="af_heart">Heart</option>
            <option value="af_bella">Bella</option>
            <option value="am_michael">Michael</option>
          </select>
          <dl class="format"><dt>Output</dt><dd>WAV · 24 kHz · Mono</dd></dl>
          <button type="submit">Generate audio <span aria-hidden="true">→</span></button>
        </div>
      </form>
      <p id="status" role="status"></p>
      <section class="panel result" id="result" aria-label="Generated audio" hidden>
        <audio controls preload="metadata" aria-label="Generated speech"></audio>
        <a download="voiceforge.wav">Download WAV</a>
      </section>
    </section>

    <section id="benchmarks" aria-labelledby="benchmark-title">
      <header class="section-heading">
        <h2 id="benchmark-title">Inference benchmarks</h2>
        <p>Track latency, capacity, and resource use as VoiceForge changes.</p>
      </header>
      <div class="benchmark-layout">
        <nav class="panel phase-nav" aria-label="Benchmark phases" id="phase-nav"></nav>
        <article class="panel analysis" aria-labelledby="phase-title">
          <div class="analysis-heading">
            <div><h3 id="phase-title"></h3><p id="phase-scope"></p></div>
            <span id="phase-status" class="badge"></span>
          </div>
          <div id="measurements"></div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
