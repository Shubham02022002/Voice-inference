name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository setup
        run: |
          test -s README.md
          test -s VOICEFORGE_PROJECT_PLAN.md
          test -s .env.example
          git check-ignore -q .env
          git ls-files --error-unmatch .env.example >/dev/null
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Local .env must not be tracked"
            exit 1
          fi
          git show --format= --check HEAD
